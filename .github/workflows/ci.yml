name: CI

# Enforces exactly the three gates that gate "done" locally — analyze, format, test —
# so nothing passes here that would fail on a developer's machine or vice versa.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Pinned, not `channel: stable`: an unpinned channel drifts to whatever release is
      # current on the day CI runs, which re-resolves transitive package versions in
      # pubspec.lock for reasons that have nothing to do with this repo's own code —
      # and the up-to-date check below can't tell that apart from a real stale-codegen
      # diff. Bump this deliberately, together with pubspec.lock, when upgrading Flutter.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true

      - run: flutter pub get

      # Drift and gen-l10n output is committed. Regenerating and then checking the tree
      # is what catches a schema change that was never regenerated.
      #
      # `dart format` has to run BEFORE the diff, not as a separate gate after it.
      # drift_dev formats its own output with a programmatic DartFormatter, which does
      # not read `formatter.page_width` from analysis_options.yaml and so emits 80
      # columns; `dart format .` does read it and emits 90. Diffing straight after
      # codegen compares those two widths against each other and fails on every run,
      # whether or not anything is genuinely stale. Formatting first also folds the old
      # `--set-exit-if-changed` gate into this one check.
      - run: dart run build_runner build
      - run: flutter gen-l10n
      - run: dart format .
      - name: Generated code and formatting are up to date
        run: git diff --exit-code

      - run: flutter analyze
      - run: flutter test

  # The Edge Functions are the only place in the system where a control can exist at
  # all, and they are not Dart, so the job above never sees them.
  edge-functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # `check` is the one that matters: these files are deployed straight from source,
      # so a type error ships.
      - run: deno check vote/index.ts tmdb/index.ts
      - run: deno lint
      - run: deno fmt --check
      - run: deno test

  build-android:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true

      - run: flutter pub get

      # Placeholder values: this job proves the app compiles, not that it talks to
      # anything. Real keys never enter CI — the anon key is publishable, but there is
      # no reason for a build check to carry one.
      - run: >
          flutter build apk --debug
          --dart-define=SUPABASE_URL=https://example.supabase.co
          --dart-define=SUPABASE_ANON_KEY=ci
